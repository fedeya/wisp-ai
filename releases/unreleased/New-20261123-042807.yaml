kind: New
body: "You can now chat with Wisp in a different language from its interface. Pick one in **Settings → Chat language**: suggested questions, routine requests and Wisp's greeting use it, so Wisp answers them in that language. Wisp still answers whatever you type in the language you write it in. The interface keeps the language set under **Settings → Interface language**."
