kind: New
body: Wisp now knows what every dungeon and raid boss drops, including Forever's new dungeons and the drops Forever added to classic bosses, with drop chances. It compares each item with your gear, skips weapons and armor your class can never use, and points out upgrades you could use after training a weapon or armor skill.
