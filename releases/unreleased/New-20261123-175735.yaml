kind: New
body: 'Experimental, on Nightly: when you die, wipe on a boss, level up, loot an upgrade, enter a dungeon, accept a quest, or open the auction house, a vendor or a trainer, Wisp shows a small card with a question you can ask in one click, such as "Why did I just die?" Nothing is sent until you click it. Turn it on or off in **Settings → Experimental → Ask Wisp moments**.'
