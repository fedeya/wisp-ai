kind: New
body: Wisp now updates itself. New versions download in the background and install once WoW has been closed for 10 minutes and no reply is running, so an update never interrupts your game. If Wisp was in the tray when it updated itself, it stays there. You can turn this off in **Settings → App updates → Install updates automatically**.
