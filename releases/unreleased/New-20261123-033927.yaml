kind: New
body: 'If you use the Polestar guide addon, Wisp can see which guide you are following, your current step and its goals, and the next steps, so you can ask about them directly. Wisp can also build a guide for you in Polestar, such as a quest chain or a gathering run: Polestar tracks it and points the way, and Wisp can update it later without losing your progress.'
