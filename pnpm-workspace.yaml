packages:
  - apps/*
  - packages/*
  - scripts
  - tests
  - addon

allowBuilds:
  esbuild: true
  core-js: false
  # Hooks are installed by the root `prepare` script instead.
  lefthook: false

# Package boundaries stay explicit; undeclared transitive imports are not hoisted.
hoist: false

# Optional native archive codecs from just-bash are not used by Wisp.
ignoredOptionalDependencies:
  - '@mongodb-js/zstd'
  - node-liblzma

# The Mastra CLI accepts newer server packages than the pinned @mastra/core
# supports; keep the whole Mastra runtime on one release.
overrides:
  '@mastra/deployer': 1.82.0
  '@mastra/server': 1.82.0

minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.10.8'
  - '@posthog/core@1.67.1'
  - '@posthog/types@1.423.0'
  - posthog-js@1.447.10
  - posthog-node@5.68.2
