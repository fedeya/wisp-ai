packages:
  - apps/*
  - packages/*
  - scripts
  - tests
  - addon

allowBuilds:
  esbuild: true
  core-js: false

# Package boundaries stay explicit; undeclared transitive imports are not hoisted.
hoist: false

# Optional native archive codecs from just-bash are not used by Wisp.
# Eve also excludes these when installing its optional just-bash engine.
ignoredOptionalDependencies:
  - '@mongodb-js/zstd'
  - node-liblzma

minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.10.8'
  - '@posthog/core@1.67.1'
  - '@posthog/types@1.423.0'
  - posthog-js@1.447.10
  - posthog-node@5.68.2
