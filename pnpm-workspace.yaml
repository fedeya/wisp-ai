packages:
  - apps/*
  - packages/*
  - scripts
  - tests
  - addon

allowBuilds:
  esbuild: true
  core-js: false
  # Hooks are installed by the root `prepare` script instead.
  lefthook: false

# Package boundaries stay explicit; undeclared transitive imports are not hoisted.
hoist: false

packageExtensions:
  # The bridge uses NodeRuntime, not the Redis adapter.
  '@effect/platform-node@4.1.3':
    peerDependenciesMeta:
      redis:
        optional: true

overrides:
  # Wisp uses its own eval and judge adapters; the optional AI SDK integration is unused.
  'vitest-evals@0.18.1>ai:peer': '-'

# Optional native archive codecs from just-bash are not used by Wisp.
ignoredOptionalDependencies:
  - '@mongodb-js/zstd'
  - node-liblzma

minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.10.8'
  - '@posthog/core@1.67.1'
  - '@posthog/types@1.423.0'
  - posthog-js@1.447.10
  - posthog-node@5.68.2
