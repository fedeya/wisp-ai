<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wisp AI — Offline addon demo</title>
    <style>
      html,
      body {
        width: 1280px;
        height: 840px;
        overflow: hidden;
        background: #101a1b !important;
      }
      body {
        position: relative;
      }
      #masthead {
        height: 72px;
        padding: 18px 40px 0;
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
        z-index: 100;
      }
      #masthead img {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }
      #masthead h1 {
        margin: 0;
        font:
          500 23px/1.3 system-ui,
          sans-serif;
        color: #eeeae1;
        letter-spacing: -0.5px;
      }
      #masthead small {
        margin-left: auto;
        font:
          10px system-ui,
          sans-serif;
        color: #a8e0c2;
        letter-spacing: 2px;
      }
      #stage.stage {
        position: relative;
        width: 1280px;
        height: 720px;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        background: radial-gradient(ellipse at 50% 50%, #243334 0%, #101a1b 70%);
      }
      #disclosure {
        position: absolute;
        bottom: 15px;
        left: 40px;
        right: 40px;
        display: flex;
        justify-content: space-between;
        font:
          11px system-ui,
          sans-serif;
        color: #a2b1a7;
        letter-spacing: 0.2px;
      }
      #controls {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        z-index: 200;
        background: #152121;
        padding: 8px;
        gap: 8px;
      }
      body.interactive #controls {
        display: flex;
      }
    </style>
  </head>
  <body>
    <header id="masthead">
      <img src="/wisp.png" alt="" />
      <h1 id="scene-title">A question about your gear.</h1>
      <small>WISP AI · OFFLINE DEMO</small>
    </header>
    <div id="stage" class="stage"></div>
    <footer id="disclosure">
      <span>Original addon Lua · Sample character & responses · Emulated game textures</span
      ><span>wisp.fedeya.sh</span>
    </footer>
    <div id="controls" aria-label="Demo scenes">
      <button data-scene="0" disabled>Empty chat</button
      ><button data-scene="3" disabled>Gear</button><button data-scene="4" disabled>Quests</button
      ><button data-scene="5" disabled>Tracker: 12</button
      ><button data-scene="6" disabled>16</button><button data-scene="7" disabled>20</button>
    </div>
    <script type="module" src="/wisp.ts"></script>
  </body>
</html>
