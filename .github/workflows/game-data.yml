name: Game data build
# Fails when wago.tools lists a Forever build newer than the one the game data
# is generated from (packages/game-data/build.json). Scheduled, not a PR check:
# a patch should prompt a regeneration, not block unrelated changes.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The check script has no dependencies, so it runs without pnpm install;
      # verify-deps-before-run=false stops pnpm installing the workspace first.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Compare the pinned Forever build with the latest
        run: pnpm --config.verify-deps-before-run=false data:check
