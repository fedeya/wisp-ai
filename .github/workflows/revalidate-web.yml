name: Refresh release website
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-release-website
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.draft
    runs-on: ubuntu-latest
    steps:
      # Use the maintained refresh script, including for releases with older tags.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Expire release data and warm the website
        run: node scripts/revalidate-web.ts
        env:
          WEB_REVALIDATION_SECRET: ${{ secrets.WEB_REVALIDATION_SECRET }}
          RELEASE_TAG: ${{ github.event.action != 'deleted' && startsWith(github.event.release.tag_name, 'v') && github.event.release.tag_name || '' }}
