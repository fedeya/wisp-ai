name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.inputs.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Determine whether app packaging is needed
        id: inputs
        run: node scripts/release-inputs.ts
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
  validate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
  validate-before-build:
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
  windows:
    needs: [release-inputs, validate-before-build]
    if: >-
      !cancelled() &&
      needs.release-inputs.result == 'success' &&
      needs.release-inputs.outputs.app == 'true' &&
      (github.ref == 'refs/heads/main' || needs.validate-before-build.result == 'success')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      nightly: ${{ steps.release.outputs.nightly }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Prepare version and shared release notes
        id: release
        run: node scripts/prepare-release.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate release version and signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before building a release.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(-nightly\.\d+\.\d+)?$') { throw 'Expected a stable or nightly release version.' }
          if ($version -ne $desktopVersion -or $version -ne $tauriVersion -or $version -ne $cargoVersion) { throw 'App versions must match.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match app version.' }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm ui:build
      - name: Fingerprint native executable inputs
        id: native-key
        run: node scripts/native-cache-key.ts
      - name: Restore optimized native executable
        id: native-binary
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/wisp-native
          key: wisp-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        if: steps.native-binary.outputs.cache-hit != 'true'
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - uses: ./.github/actions/setup-simulator
      - run: pnpm build:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wisp-windows-x64
          if-no-files-found: ignore
          overwrite: true
          path: |
            dist/*-setup.exe
            dist/*.sha256
            dist/*.sig
            dist/latest.json
            dist/build-metrics.json
            dist/release-notes.md
      - name: Verify installer before publishing
        run: node scripts/verify-installer.ts
  publish:
    needs: [validate, windows]
    if: >-
      !cancelled() &&
      needs.windows.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && needs.validate.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@v4
        with:
          name: Wisp-windows-x64
          path: dist
      - name: Restore the built nightly version
        if: needs.windows.outputs.nightly == 'true'
        run: node scripts/release-version.ts "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows.outputs.tag }}
          name: ${{ needs.windows.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.windows.outputs.nightly == 'true' }}
          body_path: dist/release-notes.md
          files: |
            dist/*-setup.exe
            dist/*.sha256
            dist/*.sig
      - name: Attach updater manifest with release notes
        run: node scripts/finalize-release.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
          RELEASE_NIGHTLY: ${{ needs.windows.outputs.nightly }}
      # GITHUB_TOKEN publications do not trigger another release-event workflow.
      - name: Refresh website after publishing Nightly
        if: needs.windows.outputs.nightly == 'true'
        run: node scripts/revalidate-web.ts
        env:
          WEB_REVALIDATION_SECRET: ${{ secrets.WEB_REVALIDATION_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
