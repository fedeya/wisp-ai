name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
  windows:
    needs: validate
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Prepare version and shared release notes
        id: release
        run: node scripts/prepare-release.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate release version and signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before building a release.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(-nightly\.\d+\.\d+)?$') { throw 'Expected a stable or nightly release version.' }
          if ($version -ne $desktopVersion -or $version -ne $tauriVersion -or $version -ne $cargoVersion) { throw 'App versions must match.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match app version.' }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm ui:build
      - name: Fingerprint native executable inputs
        id: native-key
        run: node scripts/native-cache-key.ts
      - name: Restore optimized native executable
        id: native-binary
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/wisp-native
          key: wisp-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        if: steps.native-binary.outputs.cache-hit != 'true'
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - name: Restore pinned simulator build
        id: simulator-binary
        uses: actions/cache@v4
        with:
          path: |
            simulator/wowsimcli.exe
            simulator/manifest.json
            simulator/item-ids.json
            simulator/mage-talents.json
          key: wisp-simulator-v1-${{ runner.os }}-${{ runner.arch }}-go1.25.14-${{ hashFiles('scripts/build-simulator.ps1', 'scripts/simulator-metadata.ts', 'scripts/verify-simulator.ts', 'simulator/*.json') }}
      - uses: actions/setup-go@v6
        if: steps.simulator-binary.outputs.cache-hit != 'true'
        with:
          go-version: '1.25.14'
          cache: false
      - run: choco install protoc --yes --no-progress
        if: steps.simulator-binary.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        if: steps.simulator-binary.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
            node_modules/.cache/wowsims-levelsim
          key: wowsims-windows-go125-7f9c0e7
      - run: ./scripts/build-simulator.ps1
        if: steps.simulator-binary.outputs.cache-hit != 'true'
        shell: pwsh
      - run: pnpm build:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wisp-windows-x64
          if-no-files-found: ignore
          path: |
            dist/*-setup.exe
            dist/*.sha256
            dist/*.sig
            dist/latest.json
            dist/build-metrics.json
            dist/release-notes.md
      - name: Verify installer before publishing
        run: node scripts/verify-installer.ts
      - if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.release.outputs.nightly == 'true' }}
          body_path: dist/release-notes.md
          files: |
            dist/*-setup.exe
            dist/*.sha256
            dist/*.sig
      - name: Attach updater manifest with release notes
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: node scripts/finalize-release.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NIGHTLY: ${{ steps.release.outputs.nightly }}
      # GITHUB_TOKEN publications do not trigger another release-event workflow.
      - name: Refresh website after publishing Nightly
        if: steps.release.outputs.nightly == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: node scripts/revalidate-web.ts
        env:
          WEB_REVALIDATION_SECRET: ${{ secrets.WEB_REVALIDATION_SECRET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
